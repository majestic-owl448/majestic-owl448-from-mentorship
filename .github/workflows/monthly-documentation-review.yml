name: Monthly documentation review

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-review-issues:
    name: Create documentation review issues
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create an issue for each Markdown file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/create-documentation-review-issues.sh
